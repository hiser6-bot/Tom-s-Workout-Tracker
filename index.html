<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5b21b6">
  <title>Tom's Workout Planner 365</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="toprow">
      <button class="ghost" id="backBtn" type="button">‹ Calendar</button>
      <button class="ghost" id="resetBtn" type="button">Reset</button>
    </div>
    <h1>Add Workout</h1>
    <p id="dateLabel"></p>
  </header>

  <main>
    <section>
      <h2>What type of workout are you adding?</h2>
      <div class="type-grid" id="typeGrid"></div>
    </section>

    <section class="two-col">
      <label>Workout name<input id="workoutName" maxlength="60"></label>
      <label>Date<input id="workoutDate" type="date"></label>
      <label>Start time<input id="startTime" type="time"></label>
      <label>Status<select id="status"><option>Completed</option><option>In progress</option><option>Planned</option><option>Stopped early</option></select></label>
    </section>

    <section id="strengthPanel">
      <div class="section-title"><h2>Exercises</h2><span class="pill" id="volumePill">0 completed sets</span></div>
      <div id="exerciseList"></div>
      <button class="outline wide" id="addExercise" type="button">+ Add exercise</button>
    </section>

    <section id="cardioPanel" hidden>
      <div class="card field-grid">
        <label>Duration (minutes) *<input id="duration" type="number" min="1" max="600"></label>
        <label id="distanceLabel">Distance (miles)<input id="distance" type="number" min="0" step="0.01"></label>
        <label id="intensityLabel">Resistance<input id="intensity" type="number" min="0" step="0.1"></label>
        <label id="extraLabel">Ramp / incline<input id="extraValue" type="number" min="0" step="0.1"></label>
        <label id="paceLabel">Average speed<input id="paceValue" maxlength="15"></label>
        <label>Average heart rate<input id="avgHr" type="number" min="30" max="240"></label>
        <label>Maximum heart rate<input id="maxHr" type="number" min="30" max="240"></label>
        <label>Calories (optional)<input id="calories" type="number" min="0" max="5000"></label>
      </div>
    </section>

    <section id="otherPanel" hidden>
      <div class="card field-grid">
        <label class="span2">Activity details<textarea id="activityDetails" placeholder="Example: shoulder mobility, stretching, TRX-supported sit-to-stand"></textarea></label>
        <label>Duration (minutes) *<input id="otherDuration" type="number" min="1" max="600"></label>
        <label>Movements / rounds<input id="movementCount" type="number" min="0" max="100"></label>
      </div>
    </section>

    <section>
      <h2>Workout summary</h2>
      <div class="field-grid">
        <label>Effort / RPE<select id="rpe"><option value="">Select</option><option value="1">1 - Very easy</option><option value="2">2</option><option value="3">3 - Easy</option><option value="4">4</option><option value="5">5 - Moderate</option><option value="6">6</option><option value="7">7 - Hard</option><option value="8">8</option><option value="9">9 - Very hard</option><option value="10">10 - Maximum</option></select></label>
        <label>Total time (minutes)<input id="totalTime" type="number" min="1" max="600"></label>
      </div>
    </section>

    <section>
      <h2>Joint check</h2>
      <p class="muted">0 = none, 10 = severe. A warning appears at 5 or higher.</p>
      <div id="painControls"></div>
    </section>

    <section><label>Notes<textarea id="notes" maxlength="1000" placeholder="Equipment settings, symptoms, performance, or anything to remember next time"></textarea></label></section>

    <section class="save-template"><label><input id="saveTemplate" type="checkbox"> <span><strong>Save as reusable workout</strong><small>Adds this setup to My Workouts without changing the 365-day schedule.</small></span></label></section>

    <p id="error" class="error" role="alert"></p>
    <div id="toast" class="toast" hidden aria-live="polite"></div>

    <section class="history">
      <div class="section-title"><h2>Added workouts</h2><button class="outline" id="exportBtn" type="button">Export JSON</button></div>
      <div id="historyList"></div>
    </section>
  </main>

  <footer class="actions">
    <button class="secondary" id="saveDraft" type="button">Save draft</button>
    <button class="primary" id="saveWorkout" type="button">Save added workout</button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
